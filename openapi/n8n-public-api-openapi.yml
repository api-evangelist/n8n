  /settings/ldap/sync:
    get:
      x-eov-operation-id: getLdapSync
      x-required-scope: ldap:sync
      x-eov-operation-handler: v1/handlers/ldap/ldap.handler
      tags:
      - SettingsLdap
      summary: Retrieve LDAP synchronization history
      description: 'Retrieve the history of LDAP synchronizations, most recent first.
        Requires the `ldap:sync` scope and the LDAP feature to be licensed.

        '
      parameters:
      - name: limit
        in: query
        description: The maximum number of items to return.
        required: false
        schema:
          type: number
          example: 100
          default: 100
          maximum: 250
      - name: cursor
        in: query
        description: Paginate by setting the cursor parameter to the nextCursor attribute
          returned by the previous request's response. Default value fetches the first
          "page" of the collection. See pagination for more detail.
        required: false
        style: form
        schema:
          type: string
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: LDAP synchronization history record.
                      required:
                      - id
                      - runMode
                      - status
                      - startedAt
                      - endedAt
                      - scanned
                      - created
                      - updated
                      - disabled
                      - error
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for this sync run.
                          example: 1
                        runMode:
                          type: string
                          enum:
                          - dry
                          - live
                          description: Whether the sync was a dry run or applied live.
                          example: live
                        status:
                          type: string
                          description: Status of the synchronization (e.g., success,
                            error).
                          example: success
                        startedAt:
                          type: string
                          format: date-time
                          description: Timestamp when the synchronization started.
                          example: &id001 2025-07-21 10:30:00+00:00
                        endedAt:
                          type: string
                          format: date-time
                          description: Timestamp when the synchronization completed.
                          example: &id002 2025-07-21 10:35:00+00:00
                        scanned:
                          type: integer
                          description: Number of LDAP entries scanned during synchronization.
                          example: 42
                        created:
                          type: integer
                          description: Number of new users created during synchronization.
                          example: 5
                        updated:
                          type: integer
                          description: Number of existing users updated during synchronization.
                          example: 3
                        disabled:
                          type: integer
                          description: Number of users disabled during synchronization.
                          example: 0
                        error:
                          type: string
                          description: Error message if the synchronization failed.
                            Empty string if successful.
                          example: ''
                  nextCursor:
                    type: string
                    nullable: true
                    description: 'Paginate through the synchronization history by
                      setting the cursor parameter to the nextCursor attribute returned
                      by the previous request. A null value means there are no more
                      records.

                      '
                    example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      x-eov-operation-id: runLdapSync
      x-required-scope: ldap:sync
      x-eov-operation-handler: v1/handlers/ldap/ldap.handler
      tags:
      - SettingsLdap
      summary: Trigger an LDAP synchronization
      description: 'Manually trigger an LDAP synchronization. The response returns
        the new sync history record. Requires the `ldap:sync` scope and the LDAP feature
        to be licensed.

        '
      requestBody:
        description: Synchronization parameters.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Request body for triggering an LDAP synchronization.
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - live
                  - dry
                  description: 'Type of synchronization. ''live'' applies changes
                    to the database, ''dry'' performs a test run without persisting
                    changes.

                    '
                  example: live
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: LDAP synchronization history record.
                required:
                - id
                - runMode
                - status
                - startedAt
                - endedAt
                - scanned
                - created
                - updated
                - disabled
                - error
                properties:
                  id:
                    type: integer
                    description: Unique identifier for this sync run.
                    example: 1
                  runMode:
                    type: string
                    enum:
                    - dry
                    - live
                    description: Whether the sync was a dry run or applied live.
                    example: live
                  status:
                    type: string
                    description: Status of the synchronization (e.g., success, error).
                    example: success
                  startedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the synchronization started.
                    example: *id001
                  endedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the synchronization completed.
                    example: *id002
                  scanned:
                    type: integer
                    description: Number of LDAP entries scanned during synchronization.
                    example: 42
                  created:
                    type: integer
                    description: Number of new users created during synchronization.
                    example: 5
                  updated:
                    type: integer
                    description: Number of existing users updated during synchronization.
                    example: 3
                  disabled:
                    type: integer
                    description: Number of users disabled during synchronization.
                    example: 0
                  error:
                    type: string
                    description: Error message if the synchronization failed. Empty
                      string if successful.
                    example: ''
        '400':
          description: The request is invalid or provides malformed data.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /settings/security-policy:
    get:
      x-eov-operation-id: getSecurityPolicy
      x-required-scope: securitySettings:manage
      x-eov-operation-handler: v1/handlers/security-policy/security-policy.handler
      tags:
      - SecurityPolicy
      summary: Retrieve the security policy
      description: 'Retrieve the instance security policy: personal-space publishing
        and sharing, the execution-data redaction enforcement floor, and the read-only
        usage counts shown in the UI. Requires the `securitySettings:manage` scope
        and the Personal Space Policy feature to be licensed.

        '
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - personalSpacePublishing
                - personalSpaceSharing
                - publishedPersonalWorkflowsCount
                - sharedPersonalWorkflowsCount
                - sharedPersonalCredentialsCount
                - redactionEnforcement
                properties:
                  personalSpacePublishing:
                    type: boolean
                    description: Whether members may publish workflows and agents
                      from their personal space.
                    example: true
                  personalSpaceSharing:
                    type: boolean
                    description: Whether members may share workflows and credentials
                      from their personal space.
                    example: true
                  publishedPersonalWorkflowsCount:
                    type: integer
                    readOnly: true
                    description: Number of currently published personal workflows,
                      shown for awareness before tightening the policy.
                    example: 3
                  sharedPersonalWorkflowsCount:
                    type: integer
                    readOnly: true
                    description: Number of personal workflows currently shared with
                      other users.
                    example: 5
                  sharedPersonalCredentialsCount:
                    type: integer
                    readOnly: true
                    description: Number of personal credentials currently shared with
                      other users.
                    example: 2
                  redactionEnforcement:
                    type: object
                    additionalProperties: false
                    required:
