                          type: string
        '409':
          description: 'Import blocked by at least one conflict among the issues —
            a workflow source-id conflict, a folder conflict (id under a different
            parent, id owned by another project, or a `fail`-policy match), a tag
            conflict (rename drift or name collision), a variable whose bundled value
            differs from the resolved target''s under `variableConflictPolicy=fail`,
            or one row two projects of a package would overwrite with different values.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - issues
                properties:
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        description: 'A workflow whose source id already matches one
                          in the target project, under the `fail` conflict policy.

                          '
                        required:
                        - type
                        - sourceWorkflowId
                        - existingWorkflowId
                        - name
                        properties:
                          type:
                            type: string
                            enum:
                            - workflow-conflict
                          sourceWorkflowId:
                            type: string
                          existingWorkflowId:
                            type: string
                          name:
                            type: string
                      - type: object
                        description: 'A `source`-policy workflow whose id is already
                          taken on the instance. Workflow ids are globally unique,
                          so the id cannot be created in the target project. The existing
                          workflow may live in any project — including the target
                          project itself — and may be archived (archived workflows
                          keep their id but are never matched for updates).

                          '
                        required:
                        - type
                        - sourceWorkflowId
                        - existingWorkflowId
                        - existingProjectId
                        - isArchived
                        - name
                        properties:
                          type:
                            type: string
                            enum:
                            - workflow-id-conflict
                          sourceWorkflowId:
                            type: string
                          existingWorkflowId:
                            type: string
                          existingProjectId:
                            type: string
                            nullable: true
                            description: 'Project that owns the existing workflow,
                              or null when no owning project could be determined.

                              '
                          isArchived:
                            type: boolean
                            description: Whether the existing workflow is archived.
                          name:
                            type: string
                      - type: object
                        description: 'A workflow whose source id already matches one
                          in the target project but lives outside the requested import
                          folder. Folder-targeted imports cannot update workflows
                          in place at a different location.

