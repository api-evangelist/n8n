                      matched:
                        type: integer
                        minimum: 0
                      created:
                        type: integer
                        minimum: 0
                  variables:
                    type: object
                    description: 'Resolution of the package''s variable requirements.
                      Names only — values never travel in the response. For project
                      packages these arrays are package-level unions of per-destination
                      outcomes and may overlap (for example, a name may be created
                      with a value in one project and stubbed in another); classification
                      under concurrent external writes is best-effort.

                      '
                    required:
                    - matched
                    - missing
                    - created
                    - stubbed
                    - updated
                    properties:
