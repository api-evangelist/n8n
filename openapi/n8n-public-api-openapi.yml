                        required:
                        - type
                        - sourceWorkflowId
                        - existingWorkflowId
                        - existingParentFolderId
                        - targetFolderId
                        - name
                        properties:
                          type:
                            type: string
                            enum:
                            - workflow-folder-conflict
                          sourceWorkflowId:
                            type: string
                          existingWorkflowId:
                            type: string
                          existingParentFolderId:
                            type: string
                            nullable: true
                            description: 'Folder that currently contains the matched
                              workflow, or null when it lives at the project root.

                              '
                          targetFolderId:
                            type: string
                            description: Folder the import was requested to land in.
                          name:
                            type: string
                      - type: object
                        description: 'A project defined by the package that already
                          exists on this instance, under `projectConflictPolicy=fail`.

                          '
                        required:
                        - type
                        - kind
                        - sourceProjectId
                        - name
                        properties:
                          type:
                            type: string
                            enum:
                            - project-conflict
                          kind:
                            type: string
                            enum:
                            - fail-policy
                          sourceProjectId:
                            type: string
                          name:
                            type: string
                            description: The project's name as it appears in the package.
                      - type: object
                        description: 'A package folder that cannot be imported as-is.
                          `kind` distinguishes the cause: `parent-mismatch` (a folder
                          matched by id sits under a different parent than the package
                          places it), `id-in-other-project` (the folder id already
                          exists in a different project — ids are globally unique),
                          or `fail-policy` (the folder already exists and `folderConflictPolicy`
                          is `fail`).

                          '
                        required:
                        - type
                        - kind
                        - sourceFolderId
                        - name
                        properties:
                          type:
                            type: string
                            enum:
                            - folder-conflict
                          kind:
                            type: string
                            enum:
                            - parent-mismatch
                            - id-in-other-project
                            - fail-policy
                          sourceFolderId:
                            type: string
                          name:
                            type: string
                          existingParentFolderId:
                            type: string
                            nullable: true
                            description: 'For `parent-mismatch`: the matched folder''s
                              current parent in the target.'
                          expectedParentFolderId:
                            type: string
                            nullable: true
                            description: 'For `parent-mismatch`: the parent the package
                              would place the folder under.'
                          existingProjectId:
                            type: string
                            nullable: true
                            description: 'For `id-in-other-project`: the project that
                              already owns the id.'
                      - type: object
                        description: 'A workflow that `folderConflictPolicy=overwrite`
                          would remove, because the package does not contain it, but
                          the caller lacks `workflow:delete` on. Reported instead
                          of removing a subset, which would leave the project matching
                          neither the package nor its previous state.

                          '
                        required:
                        - type
                        - workflowId
                        - name
                        - projectId
                        properties:
                          type:
                            type: string
                            enum:
                            - workflow-removal-forbidden
                          workflowId:
                            type: string
                          name:
                            type: string
                          projectId:
                            type: string
                            description: Project the workflow was being reconciled
                              against.
                      - type: object
                        description: 'A folder that `folderConflictPolicy=overwrite`
                          would delete — the package does not define it and reconciliation
                          leaves it empty — but the caller lacks `folder:delete` on
                          the target project. Reported instead of removing a subset,
                          which would leave the project matching neither the package
                          nor its previous state.

                          '
                        required:
                        - type
                        - folderId
                        - name
                        - projectId
                        properties:
                          type:
                            type: string
                            enum:
                            - folder-removal-forbidden
                          folderId:
                            type: string
                          name:
                            type: string
                          projectId:
                            type: string
                            description: Project the folder was being reconciled against.
                      - type: object
                        description: 'A node type — or a version of a node type —
                          used by a package workflow that this instance does not have,
                          under `missingNodeTypeMode=fail`. One issue is reported
                          per missing `(nodeType, typeVersion)` pair.

                          '
                        required:
                        - type
                        - nodeType
                        - typeVersion
                        - usedByWorkflows
