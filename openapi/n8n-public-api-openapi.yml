                            policy to this workflow.

                            '
                          properties:
                            state:
                              type: string
                              enum:
                              - published
                              - unpublished
                              - unchanged
                              - blocked
                              - failed
                              description: '`blocked` means the imported version could
                                not be published and no version is active (for example
                                because the workflow uses a stubbed credential, or
                                uses a node type this instance does not have). When
                                a prior published version remains active, `state`
                                is `unchanged` with `skippedPublishReason` instead.
                                `failed` means publish or unpublish was attempted
                                but did not succeed.

                                '
                            error:
                              type: string
                              description: 'Present when `state` is `failed`. Explains
                                why publish or unpublish could not be applied.

                                '
                            blockedReason:
                              type: string
                              enum:
                              - stub-credential
                              - missing-node-type
                              description: 'Present when `state` is `blocked`: the
                                imported version could not be published and no version
                                is active.

                                '
                            skippedPublishReason:
                              type: string
                              enum:
                              - stub-credential
                              - missing-node-type
                              description: 'Present when `state` is `unchanged` but
                                the policy wanted to publish the imported version:
                                a prior published version is still active (for example
                                after an update with stubbed credentials).

                                '
                        status:
                          type: string
                          enum:
                          - created
                          - updated
                          - skipped
                          description: Import outcome for this package workflow.
                  removedWorkflows:
                    type: array
                    description: 'Workflows the target had that the package does not,
                      removed by `folderConflictPolicy=overwrite`. Empty under every
                      other policy.

                      '
                    items:
                      type: object
                      required:
                      - workflowId
                      - name
                      - projectId
                      - parentFolderId
                      - deletion
                      properties:
                        workflowId:
                          type: string
                          description: Id of the removed workflow on this instance.
                        name:
                          type: string
                        projectId:
                          type: string
                          description: Project the workflow was reconciled against.
                        parentFolderId:
                          type: string
                          nullable: true
                          description: Folder that held the workflow, or null at the
                            project root.
                        deletion:
                          type: string
                          enum:
                          - archived
                          - deleted
                          description: 'What actually happened, not what `overwriteDeletionPolicy`
