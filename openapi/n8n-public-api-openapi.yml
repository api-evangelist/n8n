                            type: string
                            enum:
                            - rename-drift
                            - name-collision
                            - invalid-name
                            - invalid-id
                            - permission-denied
                          sourceId:
                            type: string
                            description: Tag id as it appears in the package. Absent
                              for `permission-denied`.
                          name:
                            type: string
                            description: The (trimmed) package tag name. Absent for
                              `permission-denied`.
                          missingScope:
                            type: string
                            enum:
                            - tag:create
                            - tag:update
                            description: 'For `permission-denied`: the global scope
