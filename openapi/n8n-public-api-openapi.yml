  /audit:
    post:
      x-eov-operation-id: generateAudit
      x-required-scope: securityAudit:generate
      x-eov-operation-handler: v1/handlers/audit/audit.handler
      tags:
      - Audit
      summary: Generate an audit
      description: Generate a security audit for your n8n instance.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                additionalOptions:
                  type: object
                  properties:
                    daysAbandonedWorkflow:
                      type: integer
                      description: Days for a workflow to be considered abandoned
                        if not executed
                    categories:
                      type: array
                      items:
                        type: string
                        enum:
                        - credentials
                        - database
                        - nodes
                        - filesystem
                        - instance
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Credentials Risk Report:
                    type: object
                    example:
                      risk: credentials
                      sections:
                      - title: Credentials not used in any workflow
                        description: These credentials are not used in any workflow.
                          Keeping unused credentials in your instance is an unneeded
                          security risk.
                        recommendation: Consider deleting these credentials if you
                          no longer need them.
                        location:
                        - kind: credential
                          id: '1'
                          name: My Test Account
                  Database Risk Report:
                    type: object
                    example:
                      risk: database
                      sections:
                      - title: Expressions in "Execute Query" fields in SQL nodes
                        description: This SQL node has an expression in the "Query"
                          field of an "Execute Query" operation. Building a SQL query
                          with an expression may lead to a SQL injection attack.
                        recommendation: Consider using the "Query Parameters" field
                          to pass parameters to the query
                        or validating the input of the expression in the "Query" field.: null
                        location:
                        - kind: node
                          workflowId: '1'
                          workflowName: My Workflow
                          nodeId: 51eb5852-ce0b-4806-b4ff-e41322a4041a
                          nodeName: MySQL
                          nodeType: n8n-nodes-base.mySql
                  Filesystem Risk Report:
                    type: object
                    example:
                      risk: filesystem
                      sections:
                      - title: Nodes that interact with the filesystem
                        description: This node reads from and writes to any accessible
                          file in the host filesystem. Sensitive file content may
                          be manipulated through a node operation.
                        recommendation: Consider protecting any sensitive files in
                          the host filesystem
                        or refactoring the workflow so that it does not require host filesystem interaction.: null
                        location:
                        - kind: node
                          workflowId: '1'
                          workflowName: My Workflow
                          nodeId: 51eb5852-ce0b-4806-b4ff-e41322a4041a
                          nodeName: Ready Binary file
                          nodeType: n8n-nodes-base.readBinaryFile
                  Nodes Risk Report:
                    type: object
                    example:
                      risk: nodes
                      sections:
                      - title: Community nodes
                        description: This node is sourced from the community. Community
                          nodes are not vetted by the n8n team and have full access
                          to the host system.
                        recommendation: Consider reviewing the source code in any
                          community nodes installed in this n8n instance
                        and uninstalling any community nodes no longer used.: null
                        location:
                        - kind: community
                          nodeType: n8n-nodes-test.test
                          packageUrl: https://www.npmjs.com/package/n8n-nodes-test
                  Instance Risk Report:
                    type: object
                    example:
                      risk: execution
                      sections:
                      - title: Unprotected webhooks in instance
                        description: These webhook nodes have the "Authentication"
                          field set to "None" and are not directly connected to a
                          node to validate the payload. Every unprotected webhook
                          allows your workflow to be called by any third party who
                          knows the webhook URL.
                        recommendation: Consider setting the "Authentication" field
                          to an option other than "None"
                        or validating the payload with one of the following nodes.: null
                        location:
                        - kind: community
                          nodeType: n8n-nodes-test.test
                          packageUrl: https://www.npmjs.com/package/n8n-nodes-test
        '401':
          description: Unauthorized
        '500':
          description: Internal server error.
  /settings/ldap:
    get:
      x-eov-operation-id: getLdapConfiguration
      x-required-scope: ldap:manage
      x-eov-operation-handler: v1/handlers/ldap/ldap.handler
      tags:
      - SettingsLdap
      summary: Retrieve the LDAP configuration
      description: 'Retrieve the current LDAP configuration, including every field
        exposed in the UI. The binding admin password is redacted on read. Requires
        the `ldap:manage` scope and the LDAP feature to be licensed.

        '
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: 'Full LDAP configuration. Every field is returned by
                  GET; send the full object back as PUT body.

                  '
                required:
                - loginEnabled
                - loginLabel
                - connectionUrl
                - allowUnauthorizedCerts
                - connectionSecurity
                - connectionPort
                - baseDn
                - bindingAdminDn
                - bindingAdminPassword
                - firstNameAttribute
                - lastNameAttribute
                - emailAttribute
                - loginIdAttribute
                - ldapIdAttribute
                - userFilter
                - synchronizationEnabled
                - synchronizationInterval
                - searchPageSize
                - searchTimeout
                - enforceEmailUniqueness
                properties:
                  loginEnabled:
                    type: boolean
                    description: Whether LDAP login is enabled.
                    example: false
                  loginLabel:
                    type: string
                    description: Label shown on the LDAP login button.
                    example: LDAP
                  connectionUrl:
                    type: string
                    description: LDAP server URL.
                    example: ldap://ldap.example.com
                  allowUnauthorizedCerts:
                    type: boolean
                    description: Whether to allow unauthorized (self-signed) certificates.
                    example: false
                  connectionSecurity:
                    type: string
                    enum:
                    - none
                    - tls
                    - startTls
                    description: TLS/SSL security mode for the LDAP connection.
                    example: none
                  connectionPort:
                    type: integer
                    description: LDAP server port.
                    example: 389
                  baseDn:
                    type: string
                    description: Base DN for LDAP search queries.
                    example: dc=example,dc=com
                  bindingAdminDn:
                    type: string
                    description: DN of the LDAP admin user for binding.
                    example: cn=admin,dc=example,dc=com
                  bindingAdminPassword:
                    type: string
                    description: 'Password for the LDAP admin user. Redacted on GET;
                      returns the blanking placeholder when a password is stored,
                      empty string when unset. Send the blanking placeholder from
                      a prior GET to keep the stored password unchanged.

                      '
                  firstNameAttribute:
                    type: string
                    description: LDAP attribute mapped to the user's first name.
                    example: givenName
                  lastNameAttribute:
                    type: string
                    description: LDAP attribute mapped to the user's last name.
                    example: sn
                  emailAttribute:
                    type: string
                    description: LDAP attribute mapped to the user's email.
                    example: mail
                  loginIdAttribute:
                    type: string
                    description: LDAP attribute used for login (usually the same as
                      emailAttribute).
                    example: mail
                  ldapIdAttribute:
                    type: string
                    description: LDAP attribute that uniquely identifies a user.
                    example: uid
                  userFilter:
                    type: string
                    description: 'Additional LDAP filter to apply when searching for
                      users. Use an empty string for no additional filter.

                      '
                    example: (objectClass=inetOrgPerson)
                  synchronizationEnabled:
                    type: boolean
                    description: Whether automatic LDAP synchronization is enabled.
                    example: false
                  synchronizationInterval:
                    type: integer
                    description: Interval in minutes between automatic synchronizations.
                      Ignored if synchronizationEnabled is false.
                    example: 60
                  searchPageSize:
                    type: integer
                    description: Number of LDAP entries to fetch per search page.
                    example: 1000
                  searchTimeout:
                    type: integer
                    description: LDAP search timeout in seconds.
                    example: 60
                  enforceEmailUniqueness:
                    type: boolean
                    description: 'Whether to enforce that email addresses are unique
                      across LDAP users. When true, if two users have the same email,
                      only the first will be imported.

                      '
                    example: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
