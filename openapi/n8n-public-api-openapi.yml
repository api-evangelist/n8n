components:
  schemas:
    Error:
      required:
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
    Role:
      readOnly: true
      type: object
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        name:
          type: string
          example: owner
          readOnly: true
        scope:
          type: string
          readOnly: true
          example: global
        createdAt:
          type: string
          description: Time the role was created.
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          description: Last time the role was updated.
          format: date-time
          readOnly: true
    Execution:
      type: object
      properties:
        id:
          type: number
          example: 1000
        data:
          type: object
          additionalProperties: true
          description: 'Detailed execution data. Only included when `includeData`
            is `true`.

            '
          properties:
            redactionInfo:
              type: object
              nullable: true
              description: Present when execution data has been redacted.
              properties:
                isRedacted:
                  type: boolean
                  description: Whether the execution data was redacted.
                reason:
                  type: string
                  description: The reason for redaction.
                canReveal:
                  type: boolean
                  description: Whether the current user has permission to reveal the
                    redacted data.
        finished:
          type: boolean
          example: true
        mode:
          type: string
          enum:
          - cli
          - error
          - integrated
          - internal
          - manual
          - retry
          - trigger
          - webhook
          - evaluation
          - chat
        retryOf:
          type: number
          nullable: true
        retrySuccessId:
          type: number
          nullable: true
          example: '2'
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
          nullable: true
          description: The time at which the execution stopped. Will only be null
            for executions that still have the status 'running'.
        workflowId:
          type: number
          example: '1000'
        waitTill:
          type: string
          nullable: true
          format: date-time
        customData:
          type: object
        status:
          type: string
          enum:
          - canceled
          - crashed
          - error
          - new
          - running
          - success
          - unknown
          - waiting
    Node:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: 0f5532f9-36ba-4bef-86c7-30d607400b15
        name:
          type: string
          example: Jira
        webhookId:
          type: string
        disabled:
          type: boolean
        notesInFlow:
          type: boolean
        notes:
          type: string
        type:
          type: string
          example: n8n-nodes-base.jira
        typeVersion:
          type: number
          example: 1
        executeOnce:
          type: boolean
          example: false
        alwaysOutputData:
          type: boolean
          example: false
        retryOnFail:
          type: boolean
          example: false
        maxTries:
          type: number
        waitBetweenTries:
          type: number
        continueOnFail:
          type: boolean
          example: false
          description: use onError instead
          deprecated: true
        onError:
          type: string
          example: stopWorkflow
        position:
          type: array
          items:
            type: number
          example:
          - -100
          - 80
        parameters:
          type: object
          additionalProperties: true
          example:
            additionalProperties: {}
        credentials:
          type: object
          example:
            jiraSoftwareCloudApi:
              id: '35'
              name: jiraApi
        customTelemetryTags:
          type: object
          additionalProperties: false
          properties:
            tag:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - key
                - value
                properties:
                  key:
                    type: string
                  value:
                    type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    WorkflowNodeGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - nodeIds
      properties:
        id:
          type: string
          description: Unique identifier for the node group
          example: 9b1c8e2a-4d3f-4a6b-8c7d-1e2f3a4b5c6d
        name:
          type: string
          description: Display name of the node group
          example: Data processing
        description:
          type: string
          maxLength: 155
          description: Optional plain-text description of the node group
          example: Cleans and normalizes incoming records
        nodeIds:
          type: array
          description: IDs of the nodes that belong to this group
          items:
            type: string
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        id:
          type: string
          readOnly: true
          example: 2tUt1wbLX592XDdX
        name:
          type: string
          example: Production
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    Workflow:
      type: object
      additionalProperties: false
      required:
      - name
      - nodes
      - connections
      - settings
      properties:
        id:
          type: string
          readOnly: true
          example: 2tUt1wbLX592XDdX
        name:
          type: string
          example: Workflow 1
        description:
          type: string
          description: Description of the workflow
          example: My workflow description
        parentFolderId:
          type: string
          nullable: true
          writeOnly: true
          description: ID of the folder to move the workflow into. Pass null to move
            it to the project root; omit to leave its current folder unchanged.
          example: X8ovzm8lTQjcXRZQ
        active:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        isArchived:
          type: boolean
          readOnly: true
        versionId:
          type: string
          readOnly: true
          description: Current version identifier used for optimistic locking
        triggerCount:
          type: integer
          readOnly: true
          description: Number of active trigger nodes in the workflow
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                example: 0f5532f9-36ba-4bef-86c7-30d607400b15
              name:
                type: string
                example: Jira
              webhookId:
                type: string
              disabled:
                type: boolean
              notesInFlow:
                type: boolean
              notes:
                type: string
              type:
                type: string
                example: n8n-nodes-base.jira
              typeVersion:
                type: number
                example: 1
              executeOnce:
                type: boolean
                example: false
              alwaysOutputData:
                type: boolean
                example: false
              retryOnFail:
                type: boolean
                example: false
              maxTries:
                type: number
              waitBetweenTries:
                type: number
              continueOnFail:
                type: boolean
                example: false
                description: use onError instead
                deprecated: true
              onError:
                type: string
                example: stopWorkflow
              position:
                type: array
                items:
                  type: number
                example:
                - -100
                - 80
              parameters:
                type: object
                additionalProperties: true
                example:
                  additionalProperties: {}
              credentials:
                type: object
                example:
                  jiraSoftwareCloudApi:
                    id: '35'
                    name: jiraApi
              customTelemetryTags:
                type: object
                additionalProperties: false
                properties:
                  tag:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - key
                      - value
                      properties:
                        key:
                          type: string
                        value:
                          type: string
              createdAt:
                type: string
                format: date-time
                readOnly: true
              updatedAt:
                type: string
                format: date-time
                readOnly: true
        connections:
          type: object
          example:
            Jira:
              main:
              - - node: Jira
                  type: main
                  index: 0
        nodeGroups:
          type: array
          description: Visual groupings of nodes shown as frames on the canvas
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - nodeIds
            properties:
              id:
                type: string
                description: Unique identifier for the node group
                example: 9b1c8e2a-4d3f-4a6b-8c7d-1e2f3a4b5c6d
              name:
                type: string
                description: Display name of the node group
                example: Data processing
              description:
                type: string
                maxLength: 155
                description: Optional plain-text description of the node group
                example: Cleans and normalizes incoming records
              nodeIds:
                type: array
                description: IDs of the nodes that belong to this group
                items:
                  type: string
        settings:
          type: object
          additionalProperties: false
          properties:
            saveExecutionProgress:
              type: boolean
            saveManualExecutions:
              type: boolean
            saveDataErrorExecution:
              type: string
              enum:
              - all
              - none
            saveDataSuccessExecution:
              type: string
              enum:
              - all
              - none
            executionTimeout:
              type: number
              example: 3600
              maxLength: 3600
            errorWorkflow:
              type: string
              example: VzqKEW0ShTXA5vPj
              description: The ID of the workflow that contains the error trigger
                node.
            timezone:
              type: string
              example: America/New_York
            executionOrder:
              type: string
              example: v1
            binaryMode:
              type: string
              enum:
              - separate
              - combined
              description: 'Controls how binary data is resolved from a node''s input.
                This is a derived,

                internal setting rather than something intended to be set programmatically.

                It is included in workflow responses for reference, but any value
                sent when

                creating or updating a workflow is ignored.

                '
            callerPolicy:
              type: string
              enum:
              - any
              - none
              - workflowsFromAList
              - workflowsFromSameOwner
              description: "Controls which workflows are allowed to call this workflow\
                \ using the Execute Workflow node.\nDefaults to workflowsFromSameOwner.\n\
