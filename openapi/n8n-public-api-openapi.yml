                      swept up. Empty under every other policy.

                      '
                    items:
                      type: object
                      required:
                      - folderId
                      - name
                      - projectId
                      - parentFolderId
                      properties:
                        folderId:
                          type: string
                        name:
                          type: string
                        projectId:
                          type: string
                        parentFolderId:
                          type: string
                          nullable: true
                          description: Folder that held it, or null at the project
                            root.
                  folders:
                    type: array
                    description: Folder shells created or skipped in the target project.
