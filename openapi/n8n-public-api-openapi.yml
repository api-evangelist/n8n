                        type: array
                        items:
                          type: string
                        description: 'Variable names that resolved to an existing
                          variable (importing project''s scope first, then global)
                          and were left untouched. A resolved variable this import
                          rewrote is listed under `updated` instead.

                          '
                      missing:
                        type: array
                        items:
                          type: string
                        description: 'Variable names still unresolved after import.
                          Under `variableMissingMode=do-nothing` these are warnings
                          — the import still succeeds and nothing is created. A successful
                          `create-stub` or `create-with-value` import normally leaves
                          this empty.

                          '
                      created:
                        type: array
                        items:
                          type: string
                        description: 'Variable names created with a package value
                          under `variableMissingMode=create-with-value`. Empty stubs
                          are listed under `stubbed`.

                          '
                      stubbed:
                        type: array
                        items:
                          type: string
                        description: 'Variable names created with an empty value by
                          this import under `variableMissingMode=create-stub`, or
                          because `create-with-value` had no exported value. Empty
                          for other outcomes.

                          '
                      updated:
                        type: array
                        items:
                          type: string
                        description: 'Variable names whose existing value this import
                          replaced with the package value under `variableConflictPolicy=overwrite`.
                          Empty for other policies.

                          '
                  tags:
                    type: object
                    description: 'Resolution of the tags referenced by the imported
                      workflows, matched by source id. Tag names only.

                      '
                    required:
                    - matched
                    - created
                    - renamed
                    - reconciled
                    - skipped
                    properties:
                      matched:
                        type: array
                        items:
                          type: string
                        description: 'Tags that resolved to an existing tag with the
