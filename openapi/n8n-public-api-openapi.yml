  /credentials:
    get:
      operationId: getCredentials
      x-eov-operation-id: getCredentials
      x-required-scope: credential:list
      x-eov-operation-handler: v1/handlers/credentials/credentials.handler
      tags:
      - Credential
      summary: List credentials
      description: Retrieve all credentials from your instance. Only available for
        the instance owner and admin. Credential data (secrets) is not included.
      parameters:
      - name: limit
        in: query
        description: The maximum number of items to return.
        required: false
        schema:
          type: number
          example: 100
          default: 100
          maximum: 250
      - name: cursor
        in: query
        description: Paginate by setting the cursor parameter to the nextCursor attribute
          returned by the previous request's response. Default value fetches the first
          "page" of the collection. See pagination for more detail.
        required: false
        style: form
        schema:
          type: string
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - required:
                        - id
                        - name
                        - type
                        - isManaged
                        - isGlobal
                        - isResolvable
                        - resolvableAllowFallback
                        - createdAt
                        - updatedAt
                        type: object
                        properties:
                          id:
                            type: string
                            readOnly: true
                            example: vHxaz5UaCghVYl9C
                          name:
                            type: string
                            example: John's Github account
                          type:
                            type: string
                            example: githubApi
                          isManaged:
                            type: boolean
                            readOnly: true
                            description: Whether the credential is managed by n8n
                              (managed credentials cannot be edited via the API).
                            example: false
                          isGlobal:
                            type: boolean
                            readOnly: true
                            description: Whether the credential is available for use
                              by all users.
                            example: false
                          isResolvable:
                            type: boolean
                            readOnly: true
                            description: Whether the credential can be dynamically
                              resolved by a resolver.
                            example: false
                          resolvableAllowFallback:
                            type: boolean
                            readOnly: true
                            description: Whether the credential resolver may fall
                              back to static credentials if dynamic resolution fails.
                            example: false
                          resolverId:
                            type: string
                            nullable: true
                            readOnly: true
                            description: ID of the dynamic credential resolver associated
                              with this credential, if any.
                            example: null
                          createdAt:
                            type: string
                            format: date-time
                            readOnly: true
                            example: '2022-04-29T11:02:29.842Z'
                          updatedAt:
                            type: string
                            format: date-time
                            readOnly: true
                            example: '2022-04-29T11:02:29.842Z'
                      - type: object
                        required:
                        - shared
                        properties:
                          shared:
                            type: array
                            description: Shared entries (project id, name, role, createdAt,
                              updatedAt) from the credential's shared relation
                            items:
                              type: object
                              required:
                              - id
                              - name
                              - role
                              - createdAt
                              - updatedAt
                              properties:
                                id:
                                  type: string
                                  description: Project ID
                                name:
                                  type: string
                                  description: Project name
                                role:
                                  type: string
                                  description: Role of the credential in this project
                                    (e.g. credential:owner)
                                createdAt:
                                  type: string
                                  format: date-time
                                  description: When the credential was shared with
                                    this project
                                updatedAt:
                                  type: string
                                  format: date-time
                                  description: When the sharing was last updated
                  nextCursor:
                    type: string
                    description: Paginate through credentials by setting the cursor
                      parameter to a nextCursor attribute returned by a previous request.
                      Default value fetches the first "page" of the collection.
                    nullable: true
                    example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
        '401':
          description: Unauthorized
    post:
      operationId: createCredential
