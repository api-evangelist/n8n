generated: '2026-09-03'
method: searched
source: https://docs.n8n.io/connect/connect-to-n8n-mcp-server.md
name: n8n MCP servers
status: official
description: >-
  n8n ships an official instance-level MCP server built into every n8n instance
  (Cloud and self-hosted, minimum n8n 2.2.0). MCP clients connect over
  streamable HTTP to build, edit, publish, and execute workflows, manage
  agents, and work with data tables. The docs site additionally publishes two
  public documentation MCP servers.
deployment:
  mode: remote
  endpoint: https://{your-n8n-instance}/mcp-server/http
  endpoint_note: >-
    Instance-templated, verbatim from the provider's client examples
    (e.g. https://acme.app.n8n.cloud/mcp-server/http). Each customer's n8n
    instance serves its own MCP endpoint at /mcp-server/http once
    Settings > Instance-level MCP is enabled. There is no single shared
    endpoint; app.n8n.cloud itself answers with the SPA shell (probed
    2026-09-03, HTML 200).
  auth: oauth
  auth_note: >-
    OAuth (recommended, with per-client granted permissions and scope
    selection at consent since n8n 2.32) or a bearer personal access token
    from the API key tab. Kill switch: N8N_DISABLED_MODULES=mcp (self-hosted).
  verified: searched
additional_servers:
  - name: n8n GitBook docs MCP server
    endpoint: https://docs.n8n.io/~gitbook/mcp
    transport: http
    auth: none
    verified: probed
    probe: >-
      tools/list answered 200 on 2026-09-03 with tools searchDocumentation and
      getPage (full inputSchema returned).
    tools: [searchDocumentation, getPage]
  - name: n8n Kapa.ai knowledge MCP server
    endpoint: https://n8n.mcp.kapa.ai
    transport: http
    auth: oauth
    verified: probed
    probe: 'tools/list returned 401 on 2026-09-03: auth-gated, browser sign-in flow required.'
docs:
  - https://docs.n8n.io/connect/connect-to-n8n-mcp-server/
  - https://docs.n8n.io/connect/connect-to-n8n-mcp-server/mcp-client-examples/
  - https://docs.n8n.io/connect/connect-to-n8n-mcp-server/mcp-server-tools-reference/
  - https://docs.n8n.io/connect/connect-to-n8n-docs-mcp-server/
tools_note: >-
  Tool list below is from the provider's MCP server tools reference
  (docs.n8n.io, fetched 2026-09-03). Live schemas require an authenticated
  instance; parameters are fully documented at the reference URL.
